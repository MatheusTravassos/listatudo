addEventListener('keydown',e=>{if(e.target&&e.target.tagName==='INPUT')return;if(!keys[e.code])pressed[e.code]=true;keys[e.code]=true;if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Tab'].includes(e.code))e.preventDefault();codeKey(e);});

 const p=player,id=p.hid,H0=p.H,G=run&&run.w===4?1250:1800;
 p.inv=Math.max(0,p.inv-dt);p.dashCD=Math.max(0,p.dashCD-dt);p.atkCD-=dt;p.comboT-=dt;p.swing-=dt;p.kbT-=dt;p.reflectMsg-=dt;

 if(p.rhythmT>0){p.rhythmT-=dt;if(p.rhythmT<=0)p.rhythm=0;}
 if(p.onG&&p.plat){p.x+=p.plat.dx;p.y+=p.plat.dy;}
 const mx=(down('right')?1:0)-(down('left')?1:0);
 const busy=p.beamT>0||p.superT>0||p.shellT>0||p.grabPh!=='';
 if(mx&&p.roll<=0&&!busy&&p.spring<=0)p.face=mx;
 p.fluttering=false;

 if(wantCrouch&&!p.crouch){p.crouch=true;p.y+=18;p.hh=28;}else if(!wantCrouch&&p.crouch)standUp(p);
 if(p.grabPh==='hold'){p.grab-=dt;p.inv=Math.max(p.inv,0.2);const b=boss,pr=1-p.grab/0.55;
  if(b&&!b.dead){b.lift=-Math.sin(Math.min(1,pr)*Math.PI)*80;b.stun=Math.max(b.stun||0,0.3);p.x=clamp(b.x-p.face*(b.r+12)-p.w/2,0,W-p.w);p.y=b.y+b.lift-p.hh/2;}
  if(p.grab<=0||!b||b.dead)grabSlam(p);updFlies(p,dt);return;}
